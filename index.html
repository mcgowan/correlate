<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Correlate</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cg fill=%27%233450d4%27%3E%3Crect x=%275%27 y=%275%27 width=%279%27 height=%279%27/%3E%3Crect x=%2718%27 y=%275%27 width=%279%27 height=%279%27 opacity=%27.55%27/%3E%3Crect x=%275%27 y=%2718%27 width=%279%27 height=%279%27 opacity=%27.35%27/%3E%3Crect x=%2718%27 y=%2718%27 width=%279%27 height=%279%27 opacity=%27.8%27/%3E%3C/g%3E%3C/svg%3E">
  <script>try{var s=JSON.parse(localStorage.getItem("correlate.v1")||"null"),t=(s&&s.settings&&s.settings.theme)||localStorage.getItem("correlate.theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="wordmark"><span class="mark"><i></i><i></i><i></i><i></i></span>Correlate</div>
  <nav class="nav" aria-label="Views and navigation">
    <div class="view-switch" id="view-switch" role="tablist" aria-label="View">
        <button type="button" class="btn small" data-view="calendar" role="tab" aria-selected="true">Calendar</button>
        <button type="button" class="btn small" data-view="graph" role="tab" aria-selected="false">Graph</button>
      </div>
    <div class="graph-controls" id="graph-controls" hidden>
        <div class="seg" id="period-switch" role="group" aria-label="Period">
          <button type="button" class="btn small" data-period="30d" aria-pressed="false">30d</button>
          <button type="button" class="btn small" data-period="90d" aria-pressed="false">90d</button>
          <button type="button" class="btn small" data-period="180d" aria-pressed="false">180d</button>
          <button type="button" class="btn small" data-period="1y" aria-pressed="false">1y</button>
          <button type="button" class="btn small" data-period="all" aria-pressed="false">All</button>
          <button type="button" class="btn small" data-period="custom" aria-pressed="false">Custom</button>
        </div>
        <span class="custom-range" id="custom-range" hidden><input type="date" id="range-from" aria-label="From"><span class="to">to</span><input type="date" id="range-to" aria-label="To"></span>
        <div class="seg" id="res-switch" role="group" aria-label="Resolution">
          <button type="button" class="btn small" data-res="daily" aria-pressed="false">Daily</button>
          <button type="button" class="btn small" data-res="weekly" aria-pressed="false">Weekly</button>
        </div>
      </div>
    <div class="monthnav">
      <button class="btn icon" id="prev" aria-label="Previous">&#8592;</button>
      <h2 id="month-title">September 2026</h2>
      <button class="btn icon" id="next" aria-label="Next">&#8594;</button>
      <button class="btn" id="today-btn">Today</button>
    </div>
    <button class="btn small filter-btn" id="metric-filter" type="button" aria-haspopup="menu" aria-expanded="false" title="Choose which metrics to show">All metrics</button>
    <button class="icon-btn theme-toggle" id="theme-toggle" type="button" title="Toggle theme" data-icon="sun"></button>
  </nav>
</header>

<main class="app">
  <aside class="pane left">
    <div class="pane-head">
      <div><div class="eyebrow">Metrics</div></div>
      <div class="pane-actions">
        <button class="btn small" id="add-metric">Add</button>
        <button class="btn icon small" id="metrics-toggle" type="button" aria-expanded="true" aria-controls="metric-list" title="Collapse metrics">&lt;</button>
      </div>
    </div>
    <div class="metric-list" id="metric-list"></div>
  </aside>

  <section class="pane center">
    <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="grid" id="grid"></div>
    <div class="graph" id="graph" hidden></div>
  </section>

  <aside class="pane right" id="inspector"></aside>
</main>
<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
